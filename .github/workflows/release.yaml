name: Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ZapTasks
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="ZapTasks/ZapTasks.xcodeproj"
          SCHEME="ZapTasks"
          DERIVED_DATA="$PWD/build/DerivedData"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            clean build

          APP_PATH="$DERIVED_DATA/Build/Products/Release/${SCHEME}.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found at: $APP_PATH"
            ls -la "$DERIVED_DATA/Build/Products/Release" || true
            exit 1
          fi

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          ZIP_NAME="ZapTasks-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$ZIP_NAME"

          echo "ZIP_PATH=dist/$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          STAGING="build/dmg-stage"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          cp -R "$APP_PATH" "$STAGING/ZapTasks.app"
          ln -s /Applications "$STAGING/Applications"

          DMG_NAME="ZapTasks-${VERSION}.dmg"
          hdiutil create \
            -volname "ZapTasks ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "dist/$DMG_NAME"

          echo "DMG_PATH=dist/$DMG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
          generate_release_notes: true

  update-cask:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.build-release.outputs.tag }}
      VERSION: ${{ needs.build-release.outputs.version }}

    steps:
      - name: Download DMG from the release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "ZapTasks-${VERSION}.dmg" \
            --dir dist

      - name: Compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/ZapTasks-${VERSION}.dmg"
          SHA="$(sha256sum "$DMG" | awk '{print $1}')"
          echo "DMG_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Checkout shared Homebrew tap repo
        uses: actions/checkout@v4
        with:
          repository: trinixlabs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update zaptasks cask in shared tap
        shell: bash
        run: |
          set -euo pipefail

          CASK_FILE="homebrew-tap/Casks/zaptasks.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "Cask file not found at $CASK_FILE"
            exit 1
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/ZapTasks-${VERSION}.dmg"
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${DMG_SHA256}\"|" "$CASK_FILE"
          sed -i -E "s|^  url \".*\"|  url \"${RELEASE_URL}\"|" "$CASK_FILE"

      - name: Commit and push cask update to tap main
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Casks/zaptasks.rb; then
            echo "No cask changes detected; skipping commit."
            exit 0
          fi

          git add Casks/zaptasks.rb
          git commit -m "zaptasks: update to ${VERSION}"
          git push origin HEAD:main
